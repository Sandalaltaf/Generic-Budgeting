<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Budget</title>
</head>
<body>
<style>
  :root{
    --bg:#F3F6F4;
    --card:#FFFFFF;
    --border:#DDE6E1;
    --text:#16221D;
    --text-muted:#66766F;
    --accent:#1F5F4F;
    --accent-dark:#153F35;
    --accent-soft:#E4F1EB;
    --danger:#AE3B20;
    --danger-soft:#FBEAE2;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,40,32,.06), 0 8px 24px rgba(20,40,32,.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 64px;}

  .summary-bar{
    position:sticky;top:0;z-index:20;
    background:rgba(243,246,244,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
  }
  .summary-inner{
    max-width:1080px;margin:0 auto;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;}
  .brand-title{font-size:15px;font-weight:700;letter-spacing:.2px;}
  .brand-sub{font-size:12px;color:var(--text-muted);}
  .month-field{display:flex;align-items:center;gap:8px;}
  .month-field label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .month-field input{
    border:1px solid var(--border);border-radius:9px;padding:7px 10px;
    font-size:13px;font-family:inherit;background:#fff;width:150px;
  }
  .balance-chip{
    display:flex;align-items:center;gap:10px;
    background:var(--accent-soft);
    border-radius:12px;padding:8px 16px;
    transition:background .25s ease;
  }
  .balance-chip.negative{background:var(--danger-soft);}
  .balance-label{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .balance-value{font-size:20px;font-weight:800;color:var(--accent-dark);font-variant-numeric:tabular-nums;}
  .balance-chip.negative .balance-value{color:var(--danger);}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}

  .layout{display:grid;grid-template-columns:340px 1fr;gap:24px;margin-top:28px;align-items:start;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}

  .section-label{
    font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;
    color:var(--text-muted);margin:0 0 12px 2px;
  }

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:16px;
  }
  .cat-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .cat-swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .cat-name{
    flex:1;font-size:15px;font-weight:700;border:none;background:transparent;
    padding:4px 2px;border-radius:6px;color:var(--text);min-width:0;
  }
  .cat-name:focus{outline:2px solid var(--accent-soft);background:#fff;}
  .cat-subtotal{font-size:14px;font-weight:800;color:var(--accent-dark);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .icon-btn{
    border:none;background:transparent;color:var(--text-muted);cursor:pointer;
    font-size:16px;line-height:1;padding:4px 6px;border-radius:6px;
  }
  .icon-btn:hover{background:var(--danger-soft);color:var(--danger);}

  .item-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .item-row input[type="text"]{
    flex:1;border:1px solid transparent;background:var(--bg);border-radius:8px;
    padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);min-width:0;
  }
  .item-row input[type="text"]:focus{border-color:var(--accent);background:#fff;outline:none;}
  .item-row .amount-wrap{position:relative;}
  .item-row .amount-wrap:before{
    content:"£";position:absolute;left:9px;top:50%;transform:translateY(-50%);
    font-size:12.5px;color:var(--text-muted);
  }
  .item-row input[type="number"]{
    width:96px;border:1px solid transparent;background:var(--bg);border-radius:8px;
    padding:8px 10px 8px 20px;font-size:13.5px;font-family:inherit;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .item-row input[type="number"]:focus{border-color:var(--accent);background:#fff;outline:none;}
  .item-row input[type="number"]::-webkit-outer-spin-button,
  .item-row input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .add-item{
    background:none;border:1.5px dashed var(--border);color:var(--text-muted);
    width:100%;padding:8px;border-radius:9px;font-size:12.5px;font-weight:700;
    cursor:pointer;margin-top:4px;font-family:inherit;
  }
  .add-item:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}

  .add-category{
    width:100%;padding:14px;border-radius:var(--radius);border:1.5px dashed var(--border);
    background:none;color:var(--text-muted);font-weight:700;font-size:13.5px;cursor:pointer;
    font-family:inherit;margin-top:4px;
  }
  .add-category:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft);}

  .totals-card{background:var(--accent-dark);color:#fff;border:none;}
  .totals-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13.5px;}
  .totals-row .val{font-weight:700;font-variant-numeric:tabular-nums;}
  .totals-divider{height:1px;background:rgba(255,255,255,.18);margin:8px 0;}
  .hero-balance{padding-top:6px;}
  .hero-balance .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.75;font-weight:700;}
  .hero-balance .num{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;}
  .hero-balance.negative .num{color:#FFCFBF;}

  .chart-card{display:flex;gap:16px;align-items:center;}
  .chart-card canvas{flex-shrink:0;}
  .legend{flex:1;min-width:0;max-height:220px;overflow-y:auto;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;}
  .legend-swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .legend-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .legend-pct{color:var(--text-muted);width:38px;text-align:right;flex-shrink:0;}
  .legend-amt{font-weight:700;width:64px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .empty-chart-note{font-size:12px;color:var(--text-muted);text-align:center;padding:20px 0;}

  #pieCanvas{cursor:default;}
  .pie-tooltip{
    position:fixed;pointer-events:none;z-index:50;display:none;
    background:#16221D;color:#fff;padding:7px 11px;border-radius:9px;
    font-size:12px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.22);
    white-space:nowrap;align-items:center;gap:7px;
  }
  .pie-tooltip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .pie-tooltip .amt{font-weight:800;}
  .pie-tooltip .pct{color:#B7C5BF;font-weight:600;}

  .footer-note{font-size:12px;color:var(--text-muted);text-align:center;margin-top:36px;}
</style>

<div class="summary-bar">
  <div class="summary-inner">
    <div class="brand">
      <div class="brand-title">Household Budget</div>
      <div class="brand-sub">Monthly planner</div>
    </div>
    <div class="month-field">
      <label for="monthYear">Month</label>
      <input id="monthYear" type="text" value="">
    </div>
    <div class="balance-chip" id="balanceChip">
      <div>
        <div class="balance-label">Spare balance</div>
        <div class="balance-value" id="balanceValue">£0.00</div>
      </div>
    </div>
    <button class="btn btn-primary" id="downloadBtn">Download PDF</button>
  </div>
</div>

<div class="wrap">
  <div class="layout">
    <div>
      <div class="section-label">Income</div>
      <div class="card" id="incomeCard">
        <div id="incomeItems"></div>
        <button class="add-item" id="addIncomeBtn">+ Add income source</button>
      </div>

      <div class="section-label">Spending Breakdown</div>
      <div class="card chart-card">
        <canvas id="pieCanvas" width="140" height="140"></canvas>
        <div class="legend" id="pieLegend"></div>
      </div>
      <div class="pie-tooltip" id="pieTooltip"></div>

      <div class="card totals-card">
        <div class="totals-row"><span>Total income</span><span class="val" id="totalIncomeVal">£0.00</span></div>
        <div class="totals-row"><span>Total outgoings</span><span class="val" id="totalOutVal">£0.00</span></div>
        <div class="totals-divider"></div>
        <div class="hero-balance" id="heroBalance">
          <div class="lbl">Spare balance to spend</div>
          <div class="num" id="heroBalanceVal">£0.00</div>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Outgoings</div>
      <div id="categoriesWrap"></div>
      <button class="add-category" id="addCategoryBtn">+ Add category</button>
    </div>
  </div>

  <div class="footer-note">Everything on this page stays in your browser for this session only — nothing is saved or sent anywhere. Download a PDF to keep a copy.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  const PALETTE = ['#1F5F4F','#2E86AB','#E07A5F','#F2B134','#6A4C93','#118AB2','#EF476F','#06A77D','#8338EC','#FF6B35','#3A86FF','#FFB703','#9D4EDD','#00B4A0','#D62839'];

  // Category structure and figures mirror the user's actual July 2026 budget sheet
  const DEFAULT_CATEGORIES = [
    { name: "Fixed Expenses", items: [] },
    { name: "Mortgage/Home Direct Debits", items: [] },
    { name: "Loan Repayment", items: [] },
    { name: "Fuel", items: [] },
    { name: "Car Tax", items: [] },
    { name: "Car Insurance", items: [] },
    { name: "Groceries", items: [] },
    { name: "Kids Activity Subscriptions", items: [] },
    { name: "Repairs", items: [] },
    { name: "Other", items: [] },
  ];

  const DEFAULT_INCOME = [
    {label:"Salary (take-home pay)", amount:""},
    {label:"Other income", amount:""}
  ];

  const fmt = (n) => '£' + (Math.round(n*100)/100).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});

  const incomeItemsEl = document.getElementById('incomeItems');
  const categoriesWrap = document.getElementById('categoriesWrap');
  let lastCategoryTotals = [];

  function makeItemRow(label, amount){
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <input type="text" placeholder="Description" value="${escapeAttr(label||'')}">
      <div class="amount-wrap">
        <input type="number" min="0" step="0.01" placeholder="0.00" value="${amount||''}">
      </div>
      <button class="icon-btn" title="Remove">✕</button>
    `;
    row.querySelector('.icon-btn').addEventListener('click', () => {
      row.remove();
      recalc();
    });
    return row;
  }

  function makeCategoryCard(name, items){
    const card = document.createElement('div');
    card.className = 'card cat-card';
    card.innerHTML = `
      <div class="cat-head">
        <span class="cat-swatch"></span>
        <input type="text" class="cat-name" value="${escapeAttr(name)}">
        <span class="cat-subtotal">£0.00</span>
        <button class="icon-btn" title="Delete category">✕</button>
      </div>
      <div class="cat-items"></div>
      <button class="add-item">+ Add item</button>
    `;
    const itemsEl = card.querySelector('.cat-items');
    items.forEach(it => itemsEl.appendChild(makeItemRow(it.label, it.amount)));

    card.querySelector('.add-item').addEventListener('click', () => {
      itemsEl.appendChild(makeItemRow('', ''));
      recalc();
    });
    card.querySelector('.cat-head .icon-btn').addEventListener('click', () => {
      card.remove();
      recalc();
    });
    return card;
  }

  function escapeAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  let pieSlices = [];
  let pieGeom = {cx:0, cy:0, r:0, innerR:0};

  function drawPie(canvas, data, trackHover){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,w,h);
    const total = data.reduce((s,d)=>s+d.value,0);
    const cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 2;
    const innerR = r*0.55;
    if (trackHover){ pieGeom = {cx, cy, r, innerR}; pieSlices = []; }
    if (total <= 0){
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = '#EDF2EF';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx,cy,innerR,0,Math.PI*2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      return;
    }
    let start = -Math.PI/2;
    data.forEach(d => {
      const angle = (d.value/total) * Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,start+angle);
      ctx.closePath();
      ctx.fillStyle = d.color;
      ctx.fill();
      if (trackHover){
        pieSlices.push({name:d.name, value:d.value, color:d.color, startAngle:start, endAngle:start+angle});
      }
      start += angle;
    });
    ctx.beginPath();
    ctx.arc(cx,cy,innerR,0,Math.PI*2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
  }

  function renderLegend(data, total){
    const legendEl = document.getElementById('pieLegend');
    if (!data.length || total <= 0){
      legendEl.innerHTML = '<div class="empty-chart-note">Add some amounts to see your spending breakdown</div>';
      return;
    }
    const sorted = [...data].sort((a,b) => b.value - a.value);
    legendEl.innerHTML = sorted.map(d => {
      const pct = total > 0 ? Math.round((d.value/total)*100) : 0;
      return `<div class="legend-row">
        <span class="legend-swatch" style="background:${d.color}"></span>
        <span class="legend-name">${escapeAttr(d.name)}</span>
        <span class="legend-pct">${pct}%</span>
        <span class="legend-amt">${fmt(d.value)}</span>
      </div>`;
    }).join('');
  }

  function recalc(){
    let totalIncome = 0;
    incomeItemsEl.querySelectorAll('.item-row').forEach(row => {
      const val = parseFloat(row.querySelector('input[type="number"]').value) || 0;
      totalIncome += val;
    });

    let totalOutgoings = 0;
    const categoryTotals = [];
    categoriesWrap.querySelectorAll('.cat-card').forEach((card, idx) => {
      let subtotal = 0;
      card.querySelectorAll('.item-row input[type="number"]').forEach(inp => {
        subtotal += parseFloat(inp.value) || 0;
      });
      card.querySelector('.cat-subtotal').textContent = fmt(subtotal);
      const color = PALETTE[idx % PALETTE.length];
      card.querySelector('.cat-swatch').style.background = color;
      const name = card.querySelector('.cat-name').value || 'Category';
      categoryTotals.push({name, value: subtotal, color});
      totalOutgoings += subtotal;
    });
    lastCategoryTotals = categoryTotals;

    const spare = totalIncome - totalOutgoings;

    document.getElementById('totalIncomeVal').textContent = fmt(totalIncome);
    document.getElementById('totalOutVal').textContent = fmt(totalOutgoings);
    document.getElementById('heroBalanceVal').textContent = fmt(spare);
    document.getElementById('balanceValue').textContent = fmt(spare);

    const chip = document.getElementById('balanceChip');
    const hero = document.getElementById('heroBalance');
    if (spare < 0){ chip.classList.add('negative'); hero.classList.add('negative'); }
    else { chip.classList.remove('negative'); hero.classList.remove('negative'); }

    const nonZero = categoryTotals.filter(c => c.value > 0);
    drawPie(document.getElementById('pieCanvas'), nonZero, true);
    renderLegend(nonZero, totalOutgoings);
  }

  DEFAULT_INCOME.forEach(it => incomeItemsEl.appendChild(makeItemRow(it.label, it.amount)));
  document.getElementById('addIncomeBtn').addEventListener('click', () => {
    incomeItemsEl.appendChild(makeItemRow('', ''));
    recalc();
  });

  DEFAULT_CATEGORIES.forEach(cat => categoriesWrap.appendChild(makeCategoryCard(cat.name, cat.items)));
  document.getElementById('addCategoryBtn').addEventListener('click', () => {
    const card = makeCategoryCard('New Category', [{label:'', amount:''}]);
    categoriesWrap.appendChild(card);
    card.querySelector('.cat-name').focus();
    card.querySelector('.cat-name').select();
    recalc();
  });

  document.addEventListener('input', (e) => {
    if (e.target.matches('input[type="number"]') || e.target.matches('.cat-name')) recalc();
  });

  recalc();

  // ---- Pie chart hover tooltip ----
  const pieCanvasEl = document.getElementById('pieCanvas');
  const tooltipEl = document.getElementById('pieTooltip');

  function findSliceAt(clientX, clientY){
    const rect = pieCanvasEl.getBoundingClientRect();
    const scaleX = pieCanvasEl.width / rect.width;
    const scaleY = pieCanvasEl.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;
    const dx = x - pieGeom.cx, dy = y - pieGeom.cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > pieGeom.r || dist < pieGeom.innerR) return null;
    let angle = Math.atan2(dy, dx);
    if (angle < -Math.PI/2) angle += Math.PI*2;
    return pieSlices.find(s => angle >= s.startAngle && angle < s.endAngle) || null;
  }

  pieCanvasEl.addEventListener('mousemove', (e) => {
    const slice = findSliceAt(e.clientX, e.clientY);
    if (!slice){
      tooltipEl.style.display = 'none';
      pieCanvasEl.style.cursor = 'default';
      return;
    }
    pieCanvasEl.style.cursor = 'pointer';
    const total = pieSlices.reduce((s,d) => s + d.value, 0);
    const pct = total > 0 ? Math.round((slice.value/total)*100) : 0;
    tooltipEl.innerHTML = `<span class="dot" style="background:${slice.color}"></span>${escapeAttr(slice.name)} <span class="amt">${fmt(slice.value)}</span> <span class="pct">(${pct}%)</span>`;
    tooltipEl.style.display = 'flex';
    tooltipEl.style.left = (e.clientX + 14) + 'px';
    tooltipEl.style.top = (e.clientY + 14) + 'px';
  });

  pieCanvasEl.addEventListener('mouseleave', () => {
    tooltipEl.style.display = 'none';
    pieCanvasEl.style.cursor = 'default';
  });

  // ---- PDF export ----
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const monthYear = document.getElementById('monthYear').value || '';
    const pageW = 595;
    const marginX = 48;
    const rightX = 547;
    let y;
    const pageBottom = 760;

    const checkPageBreak = (needed) => {
      if (y + needed > pageBottom){
        doc.addPage();
        y = 56;
      }
    };

    const hexToRgb = (hex) => {
      const v = hex.replace('#','');
      return [parseInt(v.substring(0,2),16), parseInt(v.substring(2,4),16), parseInt(v.substring(4,6),16)];
    };
    const tint = (hex, factor) => {
      const [r,g,b] = hexToRgb(hex);
      return [Math.round(255 - (255-r)*factor), Math.round(255 - (255-g)*factor), Math.round(255 - (255-b)*factor)];
    };

    // ---- Recompute category + income data fresh from the DOM ----
    let totalIncome = 0;
    const incomeLines = [];
    incomeItemsEl.querySelectorAll('.item-row').forEach(row => {
      const label = row.querySelector('input[type="text"]').value || '(untitled)';
      const amount = parseFloat(row.querySelector('input[type="number"]').value) || 0;
      totalIncome += amount;
      incomeLines.push([label, amount]);
    });

    let totalOutgoings = 0;
    const categoryData = [];
    categoriesWrap.querySelectorAll('.cat-card').forEach((card, idx) => {
      const catName = card.querySelector('.cat-name').value || 'Category';
      const color = PALETTE[idx % PALETTE.length];
      let subtotal = 0;
      const lineData = [];
      card.querySelectorAll('.item-row').forEach(row => {
        const label = row.querySelector('input[type="text"]').value || '(untitled)';
        const amount = parseFloat(row.querySelector('input[type="number"]').value) || 0;
        subtotal += amount;
        lineData.push([label, amount]);
      });
      totalOutgoings += subtotal;
      categoryData.push({name: catName, color, subtotal, lineData});
    });
    const spare = totalIncome - totalOutgoings;
    const spendRatio = totalIncome > 0 ? Math.min(totalOutgoings / totalIncome, 1) : 0;

    // ---- High-res pie chart image for crisp PDF printing ----
    const chartCanvas = document.createElement('canvas');
    chartCanvas.width = 480; chartCanvas.height = 480;
    drawPie(chartCanvas, categoryData.filter(c => c.subtotal > 0).map(c => ({name:c.name, value:c.subtotal, color:c.color})));
    const chartImg = chartCanvas.toDataURL('image/png');

    // ================= HEADER =================
    doc.setFillColor(21,63,53);
    doc.rect(0, 0, pageW, 118, 'F');
    // subtle accent stripe
    doc.setFillColor(31,95,79);
    doc.rect(0, 118, pageW, 4, 'F');

    doc.setFont('helvetica','bold');
    doc.setFontSize(24);
    doc.setTextColor(255,255,255);
    doc.text('Household Budget', marginX, 46);
    doc.setFont('helvetica','normal');
    doc.setFontSize(12.5);
    doc.setTextColor(190,216,206);
    doc.text(monthYear, marginX, 68);
    doc.setFontSize(9);
    doc.setTextColor(150,182,171);
    const today = new Date();
    doc.text(`Generated ${today.toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'})}`, rightX, 46, {align:'right'});

    // Spend ratio pill top-right
    const pillLabel = spare < 0 ? 'OVER BUDGET' : 'ON TRACK';
    doc.setFillColor(spare < 0 ? 201 : 255, spare < 0 ? 90 : 255, spare < 0 ? 70 : 255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    if (spare < 0){ doc.setTextColor(255,255,255); doc.setFillColor(174,59,32); }
    else { doc.setTextColor(21,63,53); doc.setFillColor(255,255,255); }
    doc.roundedRect(rightX - 82, 56, 82, 20, 10, 10, 'F');
    doc.text(pillLabel, rightX - 41, 70, {align:'center'});

    y = 150;

    // ================= STAT CARDS =================
    const cardGap = 14;
    const cardW = (rightX - marginX - cardGap*2) / 3;
    const cardH = 66;
    const cardY = y;

    function statCard(x, label, value, bgRgb, textRgb){
      doc.setFillColor(bgRgb[0], bgRgb[1], bgRgb[2]);
      doc.roundedRect(x, cardY, cardW, cardH, 10, 10, 'F');
      doc.setFont('helvetica','bold');
      doc.setFontSize(8.5);
      doc.setTextColor(textRgb[0], textRgb[1], textRgb[2]);
      doc.text(label.toUpperCase(), x + 14, cardY + 22);
      doc.setFontSize(18);
      doc.text(value, x + 14, cardY + 46);
    }
    statCard(marginX, 'Total Income', fmt(totalIncome), [228,241,235], [21,63,53]);
    statCard(marginX + cardW + cardGap, 'Total Outgoings', fmt(totalOutgoings), [251,234,226], [174,59,32]);
    statCard(marginX + (cardW + cardGap)*2, 'Spare Balance',
      fmt(spare), spare < 0 ? [251,234,226] : [228,241,235], spare < 0 ? [174,59,32] : [21,63,53]);

    y = cardY + cardH + 30;

    // ================= CHART + LEGEND =================
    checkPageBreak(150);
    doc.setFont('helvetica','bold');
    doc.setFontSize(12.5);
    doc.setTextColor(22,34,29);
    doc.text('Spending Breakdown', marginX, y);
    y += 6;
    doc.setDrawColor(31,95,79);
    doc.setLineWidth(2);
    doc.line(marginX, y + 4, marginX + 34, y + 4);
    doc.setLineWidth(1);
    y += 22;

    const chartSize = 132;
    const chartTop = y;
    doc.addImage(chartImg, 'PNG', marginX, chartTop, chartSize, chartSize);
    // Spend ratio label in donut hole
    doc.setFont('helvetica','bold');
    doc.setFontSize(13);
    doc.setTextColor(21,63,53);
    doc.text(`${Math.round(spendRatio*100)}%`, marginX + chartSize/2, chartTop + chartSize/2 - 2, {align:'center'});
    doc.setFont('helvetica','normal');
    doc.setFontSize(6.5);
    doc.setTextColor(102,118,111);
    doc.text('OF INCOME', marginX + chartSize/2, chartTop + chartSize/2 + 8, {align:'center'});

    const legendX = marginX + chartSize + 26;
    const legendData = categoryData.filter(c => c.subtotal > 0).sort((a,b) => b.subtotal - a.subtotal);
    let legendY = chartTop + 4;
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.setTextColor(102,118,111);
    doc.text('CATEGORY', legendX, legendY);
    doc.text('SHARE', rightX, legendY, {align:'right'});
    legendY += 12;
    doc.setDrawColor(221,230,225);
    doc.line(legendX, legendY - 8, rightX, legendY - 8);

    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    const legendLineH = 15.5;
    const maxLegendRows = Math.floor((chartSize - 14) / legendLineH);
    legendData.slice(0, maxLegendRows).forEach(c => {
      const [r,g,b] = hexToRgb(c.color);
      const pct = totalOutgoings > 0 ? (c.subtotal/totalOutgoings)*100 : 0;
      doc.setFillColor(r,g,b);
      doc.circle(legendX + 3, legendY - 3, 3, 'F');
      doc.setTextColor(50,60,56);
      doc.text(c.name.length > 26 ? c.name.slice(0,25)+'…' : c.name, legendX + 12, legendY);
      // mini bar
      const barX = 430, barW = 60;
      doc.setFillColor(230,235,232);
      doc.roundedRect(barX, legendY - 7, barW, 6, 3, 3, 'F');
      doc.setFillColor(r,g,b);
      doc.roundedRect(barX, legendY - 7, Math.max(barW * (pct/100), 3), 6, 3, 3, 'F');
      doc.setFont('helvetica','bold');
      doc.setTextColor(21,63,53);
      doc.text(`${Math.round(pct)}%`, rightX, legendY, {align:'right'});
      doc.setFont('helvetica','normal');
      legendY += legendLineH;
    });
    if (legendData.length > maxLegendRows){
      doc.setTextColor(102,118,111);
      doc.setFontSize(8);
      doc.text(`+ ${legendData.length - maxLegendRows} more — see full list below`, legendX, legendY);
    }

    y = Math.max(chartTop + chartSize, legendY) + 34;

    // ================= CATEGORY COMPARISON BAR CHART =================
    checkPageBreak(40 + legendData.length * 20);
    doc.setFont('helvetica','bold');
    doc.setFontSize(12.5);
    doc.setTextColor(22,34,29);
    doc.text('Category Comparison', marginX, y);
    y += 6;
    doc.setDrawColor(31,95,79);
    doc.setLineWidth(2);
    doc.line(marginX, y + 4, marginX + 34, y + 4);
    doc.setLineWidth(1);
    y += 24;

    const maxCatValue = Math.max(...legendData.map(c => c.subtotal), 1);
    const barAreaX = marginX + 160;
    const barAreaW = rightX - barAreaX - 70;
    legendData.forEach(c => {
      checkPageBreak(20);
      const [r,g,b] = hexToRgb(c.color);
      doc.setFont('helvetica','normal');
      doc.setFontSize(9);
      doc.setTextColor(50,60,56);
      const label = c.name.length > 24 ? c.name.slice(0,23)+'…' : c.name;
      doc.text(label, marginX, y);
      doc.setFillColor(238,242,240);
      doc.roundedRect(barAreaX, y - 8, barAreaW, 10, 4, 4, 'F');
      doc.setFillColor(r,g,b);
      const w = Math.max(barAreaW * (c.subtotal/maxCatValue), 4);
      doc.roundedRect(barAreaX, y - 8, w, 10, 4, 4, 'F');
      doc.setFont('helvetica','bold');
      doc.setTextColor(21,63,53);
      doc.text(fmt(c.subtotal), rightX, y, {align:'right'});
      y += 20;
    });
    y += 14;

    // ================= INCOME =================
    checkPageBreak(30 + incomeLines.length * 18);
    doc.setFont('helvetica','bold');
    doc.setFontSize(12.5);
    doc.setTextColor(22,34,29);
    doc.text('Income', marginX, y);
    y += 6;
    doc.setDrawColor(31,95,79);
    doc.setLineWidth(2);
    doc.line(marginX, y + 4, marginX + 34, y + 4);
    doc.setLineWidth(1);
    y += 22;

    incomeLines.forEach(([label, amount], i) => {
      checkPageBreak(20);
      if (i % 2 === 0){
        doc.setFillColor(244,248,246);
        doc.rect(marginX - 6, y - 12, rightX - marginX + 12, 20, 'F');
      }
      doc.setFont('helvetica','normal');
      doc.setFontSize(10.5);
      doc.setTextColor(50,60,56);
      doc.text(label, marginX + 4, y);
      doc.setFont('helvetica','bold');
      doc.setTextColor(21,63,53);
      doc.text(fmt(amount), rightX - 4, y, {align:'right'});
      y += 20;
    });
    checkPageBreak(24);
    y += 4;
    doc.setDrawColor(21,63,53);
    doc.setLineWidth(1.4);
    doc.line(marginX, y, rightX, y);
    doc.setLineWidth(1);
    y += 16;
    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    doc.setTextColor(21,63,53);
    doc.text('Total Income', marginX, y);
    doc.text(fmt(totalIncome), rightX, y, {align:'right'});
    y += 32;

    // ================= OUTGOINGS DETAIL =================
    checkPageBreak(30);
    doc.setFont('helvetica','bold');
    doc.setFontSize(12.5);
    doc.setTextColor(22,34,29);
    doc.text('Outgoings — Full Detail', marginX, y);
    y += 6;
    doc.setDrawColor(174,59,32);
    doc.setLineWidth(2);
    doc.line(marginX, y + 4, marginX + 34, y + 4);
    doc.setLineWidth(1);
    y += 22;

    categoryData.forEach(cat => {
      checkPageBreak(26 + cat.lineData.length*15 + 16);
      const [r,g,b] = hexToRgb(cat.color);
      const [tr,tg,tb] = tint(cat.color, 0.14);

      // tinted header band
      doc.setFillColor(tr,tg,tb);
      doc.roundedRect(marginX - 6, y - 13, rightX - marginX + 12, 22, 6, 6, 'F');
      doc.setFillColor(r,g,b);
      doc.roundedRect(marginX - 6, y - 13, 5, 22, 2.5, 2.5, 'F');
      doc.setFont('helvetica','bold');
      doc.setFontSize(10.5);
      doc.setTextColor(31,60,50);
      doc.text(cat.name, marginX + 8, y);
      doc.text(fmt(cat.subtotal), rightX - 4, y, {align:'right'});
      y += 22;

      doc.setFont('helvetica','normal');
      doc.setFontSize(9.5);
      cat.lineData.forEach(([label, amount], i) => {
        checkPageBreak(15);
        doc.setTextColor(90,102,96);
        doc.text(label, marginX + 12, y);
        doc.text(fmt(amount), rightX - 4, y, {align:'right'});
        y += 14.5;
      });
      y += 10;
    });

    checkPageBreak(30);
    doc.setDrawColor(174,59,32);
    doc.setLineWidth(1.4);
    doc.line(marginX, y, rightX, y);
    doc.setLineWidth(1);
    y += 16;
    doc.setFont('helvetica','bold');
    doc.setFontSize(12);
    doc.setTextColor(174,59,32);
    doc.text('Total Outgoings', marginX, y);
    doc.text(fmt(totalOutgoings), rightX, y, {align:'right'});
    y += 36;

    // ================= SPARE BALANCE BANNER =================
    checkPageBreak(56);
    if (spare < 0){ doc.setFillColor(174,59,32); } else { doc.setFillColor(21,63,53); }
    doc.roundedRect(marginX, y - 22, rightX - marginX, 48, 10, 10, 'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(11.5);
    doc.setTextColor(255,255,255);
    doc.text(spare < 0 ? 'SHORTFALL THIS MONTH' : 'SPARE BALANCE TO SPEND', marginX + 16, y);
    doc.setFontSize(19);
    doc.text(fmt(Math.abs(spare)), rightX - 16, y + 2, {align:'right'});

    // ================= FOOTERS ON EVERY PAGE =================
    const pageCount = doc.internal.getNumberOfPages();
    for (let p = 1; p <= pageCount; p++){
      doc.setPage(p);
      doc.setDrawColor(225,232,229);
      doc.line(marginX, 806, rightX, 806);
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(140,155,148);
      doc.text('Household Budget · Family monthly planner', marginX, 820);
      doc.text(`Page ${p} of ${pageCount}`, rightX, 820, {align:'right'});
    }

    const safeMonth = (monthYear || 'budget').replace(/[^a-z0-9]+/gi, '-');
    doc.save(`Household-Budget-${safeMonth}.pdf`);
  });
})();
</script></body>
</html>
